<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sri Vrindavan Accommodation Booking Portal</title>
<style>
  :root{
    --saffron:#e8891f; --saffron-dark:#c96f0d; --gold:#d4a017;
    --cream:#fff9f0; --ink:#2b2118; --muted:#7a6a58;
    --line:#ecdcc4; --green:#2e8b57; --red:#c0392b; --amber:#d9832a;
    --card:#ffffff; --shadow:0 6px 24px rgba(120,80,20,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:
    radial-gradient(1200px 500px at 50% -100px,#fff2df,transparent),var(--cream);color:var(--ink)}
  a{color:var(--saffron-dark)}
  header.topbar{background:linear-gradient(135deg,var(--saffron),var(--saffron-dark));color:#fff;
    padding:14px 22px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
  .logo{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--saffron-dark);
    display:grid;place-items:center;font-size:24px;font-weight:800}
  .brand h1{font-size:18px;margin:0;letter-spacing:.3px}
  .brand p{margin:0;font-size:12px;opacity:.9}
  .topbar .spacer{flex:1}
  .who{font-size:13px;text-align:right;line-height:1.3}
  .btn{border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;
    background:var(--saffron);color:#fff;transition:.15s}
  .btn:hover{background:var(--saffron-dark)}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
  .btn.sm{padding:5px 11px;font-size:12.5px}
  .btn.gray{background:#efe6d8;color:var(--ink)} .btn.gray:hover{background:#e3d5c1}
  .btn.green{background:var(--green)} .btn.red{background:var(--red)}
  .wrap{max-width:1120px;margin:22px auto;padding:0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  h2.section{font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:16px;line-height:1.4;font-family:inherit;background:#fffdf9}
  input:focus,select:focus,textarea:focus{outline:2px solid #f3c07a;border-color:#f3c07a}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:1fr 1fr 1fr} .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:760px){
    .g2,.g3,.g4{grid-template-columns:1fr}
    .wrap{margin:14px auto;padding:0 12px}
    .card{padding:15px;border-radius:12px}
    /* tabs scroll sideways instead of stacking into many rows */
    .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
    .tab{white-space:nowrap;flex:0 0 auto;padding:9px 15px}
    /* wide tables scroll horizontally */
    .card > table, .card .scrollx{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
    .btn{padding:11px 16px}
    .btn.sm{padding:7px 11px}
    .row-actions{grid-template-columns:1fr;gap:8px;max-width:none}
    header.topbar{padding:12px 14px}
    .brand h1{font-size:16px}
  }
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{background:#fbf3e6;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  tr:hover td{background:#fffaf1}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
  .p-pending{background:#fdf0dc;color:var(--amber)}
  .p-confirmed{background:#e3f5ea;color:var(--green)}
  .p-rejected{background:#fbe4e1;color:var(--red)}
  .p-waitlist{background:#eae6fb;color:#6c5ce7}
  .p-cancelled{background:#eeeeee;color:#888}
  .p-withdrawn{background:#f3e6e6;color:#a55}
  .p-edited{background:#e6f0fb;color:#3b6fa0}
  .stat{background:linear-gradient(135deg,#fff,#fff6e9);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .n{font-size:26px;font-weight:800;color:var(--saffron-dark)}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tab{padding:8px 16px;border-radius:999px;background:#f2e7d6;color:var(--ink);cursor:pointer;font-size:13.5px;font-weight:600}
  .tab.active{background:var(--saffron);color:#fff}
  .hidden{display:none!important}
  .muted{color:var(--muted);font-size:13px}
  .center{min-height:calc(100vh - 74px);display:grid;place-items:center;padding:20px}
  .login{width:100%;max-width:420px}
  .rolebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .rolebtn .ic{font-size:22px}
  .rolebtn{padding:14px;border:2px solid var(--line);border-radius:12px;text-align:center;cursor:pointer;background:#fffdf9}
  .rolebtn.active{border-color:var(--saffron);background:#fff4e4}
  .rolebtn .ic{font-size:22px} .rolebtn .t{font-weight:700;font-size:14px;margin-top:4px} .rolebtn .s{font-size:11px;color:var(--muted)}
  .row-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-width:270px;margin-left:auto}
  .row-actions .btn{width:100%;text-align:center;padding:6px 8px;font-size:12px;line-height:1.2;min-height:0;align-self:stretch}
  .bar{height:9px;border-radius:6px;background:#f0e6d6;overflow:hidden}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--gold))}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.3s;z-index:50}
  .toast.show{opacity:1}
  .subhead{font-size:12px;color:var(--muted);margin:-8px 0 14px}
  .flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .rooms-mini{font-size:12px;color:var(--muted)}
  .alloc{display:flex;flex-direction:column;gap:5px;min-width:225px;max-width:280px}
  .alloc .a-sel{padding:6px 8px;font-size:13px}
  .a-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .a-lbl{font-size:12px;color:var(--muted);font-weight:600}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fffdf9}
  .stepper button{border:none;background:#f2e7d6;width:26px;height:28px;font-size:15px;line-height:1;cursor:pointer;color:var(--ink)}
  .stepper button:hover{background:#e3d5c1}
  .stepper input{width:38px;border:none;text-align:center;font-weight:700;padding:6px 0;background:transparent;font-size:15px}
  .stepper input:focus{outline:none}
  /* larger touch-friendly stepper for the guest form */
  .stepper.big{width:100%;justify-content:space-between;border-radius:10px}
  .stepper.big button{width:46px;height:46px;font-size:22px}
  .stepper.big input{font-size:18px;height:46px}
  .a-num{width:46px!important;text-align:center;padding:6px 4px!important;font-size:13px}
  .a-ask{font-size:10.5px;background:#fdf0dc;color:var(--amber);padding:2px 7px;border-radius:999px;font-weight:700}
  .a-meta{font-size:11.5px;color:var(--muted);line-height:1.45}
  .notif{display:flex;align-items:center;gap:12px;border-radius:11px;padding:12px 14px;margin-bottom:9px;border:1px solid}
  .notif.unread{background:#fdecec;border-color:#f2c4c4}
  .notif.ack{background:#e7f6ec;border-color:#bfe6cd}
  .tabbadge{background:#c0392b;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:3px;font-weight:700}
  .rcp-copy{cursor:pointer;user-select:text;-webkit-user-select:text;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#f6efe2;border:1px solid var(--line);border-radius:6px;padding:4px 9px;display:inline-block}
  .rcp-copy:hover{background:#efe1c8;border-color:#e0cba0}

  .seva-free{font-size:12px;color:var(--green);background:#e7f6ec;border:1px solid #bfe6cd;border-radius:8px;padding:6px 9px;margin-top:2px}
  .seva-collect{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--amber);background:#fdf0dc;border:1px solid #f0d9b0;border-radius:8px;padding:5px 8px;margin-top:1px}

  fieldset{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:10px}
  legend{font-size:12px;color:var(--muted);padding:0 6px}
  /* Mobile: stack wide tables into readable cards (no sideways scrolling) */
  @media (max-width:640px){
    table.stack-mobile{display:block;width:100%;border:0}
    table.stack-mobile thead{position:absolute;left:-9999px;height:0;overflow:hidden}
    table.stack-mobile tbody{display:block;width:100%}
    table.stack-mobile tr{display:block;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
    table.stack-mobile td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:auto;border:0;border-bottom:1px dashed var(--line);padding:8px 0;text-align:right}
    table.stack-mobile tr td:last-child{border-bottom:0}
    table.stack-mobile td::before{content:attr(data-label);font-weight:700;color:var(--muted);text-align:left;flex:0 0 40%;white-space:nowrap}
    table.stack-mobile td .muted{text-align:right}
    table.stack-mobile td .row-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:none}
    table.stack-mobile td .btn.sm{width:100%}
  }
</style>
</head>

<!-- LOGIN -->
<div id="loginView" class="center">
  <div class="card login">
    <div style="text-align:center;margin-bottom:8px">

      <p style="margin:3px 0 0;font-family:cursive;font-size:22px;color:var(--saffron-dark)">Sri Vrindavan</p>
    </div>
    <label>Login ID</label>
    <input id="loginId" placeholder="e.g. DEV001" autocapitalize="characters" autocomplete="off">
    <label>Password</label>
    <input id="loginPass" type="password" placeholder="••••••••" autocomplete="off">
    <p id="loginHint" style="text-align:center;margin:10px 0 0;font-size:12px;color:var(--saffron-dark)"></p>
    <button id="loginBtn" class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Enter Portal</button>
    <p class="muted" style="text-align:center;margin:12px 0 0;font-size:11.5px">
      Your bookings are saved securely in the cloud and shared live across all devices.</p>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hidden">

    <div class="logo">☸</div>
    <div class="brand"><h1 style="font-size:15px;font-weight:800">Accommodation Booking Portal</h1><p style="font-family:cursive;font-size:15px;opacity:1">Sri Vrindavan</p></div>
    <div class="spacer"></div>
    <div class="who"><div id="whoName">—</div><div id="whoRole" style="opacity:.85"></div></div>
    <button class="btn ghost sm" onclick="logout()">Logout</button>
  </header>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div id="pageBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="noticeOverlay" onclick="if(event.target===this)closeNotice()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center;padding:18px">
  <div style="background:#fff;max-width:420px;width:100%;border-radius:16px;padding:22px 20px;box-shadow:0 12px 40px rgba(0,0,0,.25)">
    <div id="noticeIcon" style="font-size:34px;text-align:center;margin-bottom:6px">ℹ️</div>

  </div>
</div>

function bkRange(b){ return { in: (b&&b.checkin)||DB.rules.eventStart, out: (b&&b.checkout)||DB.rules.eventEnd }; }

function roomsAssignedByType(hid,type,excludeId,forB){ const R=forB?bkRange(forB):null;

function roomsUsedOnDate(hid,type,d){ if(!d) return peakRoomsUsed(hid,type);

    .reduce((s,b)=> s + bookingRooms(b).filter(rp=>rp.type===type).reduce((a,rp)=>a+rp.rooms,0), 0); }

/* ---- Per-hotel availability calendar ----

function hotelNights(h){ return (h && h.availNights && h.availNights.length) ? h.availNights : null; }
function hotelOpenOnNight(h,d){ const a=hotelNights(h); return a ? a.indexOf(d)>=0 : true; }
/* Hotel must be open EVERY night of the stay [ci → co) to be offered for it. */
function hotelOpenForStay(h,ci,co){ const a=hotelNights(h); if(!a) return true; if(!ci||!co) return true;

/* How far into the stay this hotel can host the guest: returns the checkout date of the portion the

  const nc=h.nightCaps && h.nightCaps[d]; return (nc!=null) ? Math.min(r.count, nc) : r.count; }
/* Rooms of a type occupied on the night of d (checkin ≤ d < checkout). A booking in a date-limited
   hotel only occupies it on the hotel's OPEN nights — on later nights the guest has moved to Braj Nidhi. */
function roomsUsedOnNight(hid,type,d,excludeId){ const h=DB.hotels.find(x=>x.id===hid);
  return DB.bookings.filter(b=>b.hotel===hid&&b.status==='confirmed'&&b.id!==excludeId
    && (b.checkin||DB.rules.eventStart)<=d && d<(b.checkout||DB.rules.eventEnd)

/* Rooms of a type free for a WHOLE stay [ci → co): the tightest night wins. 0 if the hotel is closed any night. */
function freeRoomsForStay(h,type,ci,co,excludeId){ if(!ci||!co){ const r=(h.rooms||[]).find(x=>x.type===type); return r?Math.max(0,r.count-roomsAssignedByType(h.id,type,excludeId)):0; }

let availDate=null;
function setAvailDate(v){ availDate=v; render(); }
let dashFrom=null, dashTo=null;
function setDashFrom(v){ dashFrom=v; if(dashTo && dashTo<v) dashTo=v; render(); }
function setDashTo(v){ dashTo=v; if(dashFrom && v<dashFrom) dashFrom=v; render(); }
function resetDashRange(){ dashFrom=DB.rules.eventStart; dashTo=prevDay(DB.rules.eventEnd); render(); }
/* Greedy pack a group of `need` people into a hotel's free rooms (largest rooms first). Returns a
   roomPlan [{type,rooms}] only if the WHOLE group fits (one-group-one-hotel), else null. excludeId frees that booking's rooms. */
function packGroup(hid,need,excludeId){
  const h=DB.hotels.find(x=>x.id===hid); if(!h) return null;
  const avail=h.rooms.map(r=>({type:r.type,cap:r.cap,free:Math.max(0,r.count-roomsAssignedByType(hid,r.type,excludeId))}))
    .filter(r=>r.free>0).sort((a,c)=>c.cap-a.cap);
  let remaining=need; const plan=[];
  for(const r of avail){ if(remaining<=0) break;
    const take=Math.min(r.free, Math.ceil(remaining/r.cap)); if(take>0){ plan.push({type:r.type,rooms:take}); remaining-=take*r.cap; } }
  return remaining<=0 ? plan : null;
}
/* hotels sorted by priority (1 = highest) */
function hotelsByPriority(){ return [...DB.hotels].sort((a,b)=>(a.priority||99)-(b.priority||99)); }
/* manual allocation dropdown order: general/outside guest houses first, then the reserved own houses
   (priority 1-2 = Braj Nidhi, Madhav Kutir) last, so Braj Nidhi is never the default first pick. */
function hotelsForDropdown(){ const active=DB.hotels.filter(h=>h.active);
  const general=active.filter(h=>(h.priority||99)>2).sort((a,b)=>(a.priority||99)-(b.priority||99));
  const reserved=active.filter(h=>(h.priority||99)<=2).sort((a,b)=>(a.priority||99)-(b.priority||99));
  return [...general,...reserved]; }
/* up to 2 contact persons a hotel has ticked to include in the guest's email */
function hotelSendContacts(hid){ const h=DB.hotels.find(x=>x.id===hid); return (h&&h.contacts?h.contacts.filter(c=>c.send):[]).slice(0,2); }
/* people/bookings not yet given a confirmed hotel */
function unassignedBookings(){ return DB.bookings.filter(b=>b.status==='pending'||b.status==='waitlist'); }
/* Suggest best hotel + room type + number of rooms for a booking.

/* Build candidate plans across eligible hotels. If allowExtra is false, no extra beds are used.

function reservedHotelIds(){ const map=DB.rules.categoryHotels; const inD2D3=new Set([...(map.D2||[]),...(map.D3||[])]);
  return (map.D1||[]).filter(id=>!inD2D3.has(id)); }
function buildPlans(b,allowExtra){

  const gt=b.guestType||'FR';
  const typed = gt!=='FR' && DB.rules.guestTypeHotels && (DB.rules.guestTypeHotels[gt]||[]).length;  // PR/Media/Volunteer → fixed hotel
  const cat=guestCategory(b);                                // D1 / D2 / D3
  const catList = typed ? DB.rules.guestTypeHotels[gt] : (DB.rules.categoryHotels[cat]||[]);  // suggested hotel(s)
  const reserved=reservedHotelIds();                         // D1-only hotels — never for D2/D3
  // Is any ordinary (non-reserved, non-manual) guest house available to START this stay (open on check-in night)?
  const openGeneralExists=DB.hotels.some(h=> h.active && !h.manualOnly && !reserved.includes(h.id)
      && hotelOriginEnd(h,b.checkin,b.checkout)!==null
      && b.donation>=(h.minDonation||0));
  const plans=[];
  DB.hotels.filter(h=>{ if(!h.active) return false;
      if(h.manualOnly) return false;                          // never auto-suggested (e.g. Madhav Kutir) — Super Admin assigns manually
      if(hotelOriginEnd(h,b.checkin,b.checkout)===null) return false;  // hotel not open on the check-in night → can't start the stay here
      if(typed) return catList.includes(h.id);                // PR/Media/Volunteer → only their fixed hotel, donation gate bypassed
      if(!openGeneralExists) return h.id==='h1';               // no other hotel can start these dates → offer ONLY Braj Nidhi, to every guest (bypass reserve + min gates)

function roleLabel(r){ return r==='admin'?'Super Admin':r==='vcm'?'VCM Guest House':r==='staff'?'Staff':'Devotee'; }

  const hint=$('#loginHint'); if(hint) hint.innerHTML='↩ Welcome back, <b>'+esc(last.name||'')+'</b> · last logged in as '+roleLabel(last.role)+' ('+esc(last.id||'')+')'; }
async function doLogin(){
  const id=$('#loginId').value.trim(); const pass=$('#loginPass').value;
  if(!id){ toast('Enter your Login ID'); return; }
  if(!pass){ toast('Enter your password'); return; }
  const btn=$('#loginBtn'); if(btn){ btn.disabled=true; btn.textContent='Signing in…'; }
  try{
    const email=id.toLowerCase()+'@hkm.local';
    const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
    if(error||!data.user){ toast('Invalid Login ID or password'); return; }
    const { data:prof } = await sb.from('profiles').select('login_id,role,assigned_name').eq('id',data.user.id).maybeSingle();
    if(!prof){ toast('No profile found for this login'); return; }
    USER={ id:prof.login_id, role:prof.role, name:(prof.assigned_name&&prof.assigned_name.trim())||prof.login_id };
    saveLastLogin();
    await loadFromCloud();
    $('#loginView').classList.add('hidden');
    $('#appView').classList.remove('hidden');
    $('#whoName').textContent=USER.name;
    $('#whoRole').textContent=(USER.role==='admin'?'Super Admin':USER.role==='vcm'?'VCM Guest House':USER.role==='staff'?'Staff (view only)':'Devotee')+' · '+USER.id;
    buildTabs();
    startPoll();
  }catch(e){ toast('Login failed — check your connection'); console.warn(e); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='Enter Portal'; } }
}

  }).join('');

}

/* Keep a stay's dates sane: check-out cannot be on/before check-in. Locks the check-out picker's
   minimum to the check-in date and clears an already-invalid check-out. */
function syncDates(i){
  const ci=document.querySelector('.ci[data-i="'+i+'"]'), co=document.querySelector('.co[data-i="'+i+'"]');
  if(!ci||!co) return;
  if(ci.value){ co.min=ci.value; if(co.value && co.value<=ci.value){ co.value=''; toast('Check-out must be after check-in — please pick a later date'); } }
  else { co.min=DB.rules.eventStart; }
}
function toggleSame(i){
  const ci0=document.querySelector('.ci[data-i="0"]').value, co0=document.querySelector('.co[data-i="0"]').value;
  const ci=document.querySelector('.ci[data-i="'+i+'"]'), co=document.querySelector('.co[data-i="'+i+'"]');
  const chk=document.querySelector('.sameAbove[data-i="'+i+'"]');
  if(chk.checked){ ci.value=ci0; co.value=co0; ci.disabled=true; co.disabled=true; }
  else { ci.disabled=false; co.disabled=false; }
}
function submitReq(){
  const head=$('#reqHead').value.trim();
  if(!head){ toast('Enter the head of family name'); return; }
  const total=Math.max(1,parseInt($('#reqTotal').value)||1);
  const guestType=($('#reqType')||{}).value||'FR';
  const receipt=$('#reqReceipt').value.trim();
  if(guestType==='FR' && !receipt){ toast('Donation receipt number is required for an FR Guest'); return; }
  const phoneDigits=($('#reqPhone').value||'').replace(/\D/g,'');
  if(phoneDigits && phoneDigits.length!==10){ toast('Guest mobile number must be exactly 10 digits'); return; }
  const pref=[];
  const cis=[...document.querySelectorAll('.ci')], cos=[...document.querySelectorAll('.co')], exs=[...document.querySelectorAll('.exBed')];
  const stays=cis.map((el,idx)=>({checkin:el.value, checkout:(cos[idx]||{}).value||'', extra:!!(exs[idx]&&exs[idx].checked)}));
  if(!stays.length || !stays[0].checkin || !stays[0].checkout){ toast('Enter check-in and check-out dates'); return; }
  for(let i=0;i<stays.length;i++){ const s=stays[i];
    if(!s.checkin||!s.checkout){ toast('Fill dates for room '+(i+1)); return; }
    if(s.checkout<=s.checkin){ toast('Room '+(i+1)+': check-out must be after check-in'); return; }
    if(s.checkin<DB.rules.eventStart || s.checkout>DB.rules.eventEnd){ toast('Dates must be within the festival window: '+fmtD(DB.rules.eventStart)+' to '+fmtD(DB.rules.eventEnd)); return; } }
  const rooms=Math.max(1,parseInt($('#reqRooms').value)||1);
  const data={head:head,phone:phoneDigits,guestType:guestType,accompanying:total-1,count:total,family:total>1,preferred:pref,
    donation:Number($('#reqDonation').value)||0,receipt:receipt,
    extraRequested:stays.filter(s=>s.extra).length,
    roomsRequested:rooms,
    sevaPlan:(($('#reqSevaPlan')||{}).value||'devotee'),
    stays:stays, checkin:stays[0].checkin, checkout:stays[0].checkout,
    note:$('#reqNote').value.trim()};
  if(editingId){ const b=DB.bookings.find(x=>x.id===editingId);
    if(b && !isSuper() && !isVcm() && b.status==='confirmed'){ editingId=null; confirmedLockMsg(); go('myreq'); return; }   // devotees cannot edit a confirmed booking
    if(b){ Object.assign(b,data); b.edited=true; b.editedAt=Date.now(); b.editedBy=USER.id; b.lastEditNote='Devotee updated the request (now '+b.count+' '+(b.count===1?'person':'people')+', '+b.roomsRequested+' room(s))'; b.receiptWrong=false;
      notify('edit',`Edited request: ${b.head} (now ${b.count} ${b.count===1?'person':'people'}, ${b.roomsRequested} room(s)${b.extraRequested?`, ${b.extraRequested} extra bed`:''}) — review allocation`,USER.name,b.id); }
    editingId=null; save(); toast('Request updated ✓ — admin notified'); go('myreq'); return; }
  const full = totalFreeRooms()<=0;
  const b=Object.assign({id:uid('b'),brahmachari:USER.name,devId:USER.id,extraBeds:0,
    status:'pending',hotel:'',roomType:'',rooms:0,created:Date.now(),bookedWhenFull:full},data);
  DB.bookings.unshift(b);
  notify('new',`New request: ${b.head} (${b.count} ${b.count===1?'person':'people'}) — ${b.roomsRequested} room(s)${b.extraRequested?`, ${b.extraRequested} extra bed`:''}${full?' — ⚠ received while fully booked (waitlist)':''}`,USER.name,b.id);
  save(); go('myreq');
  if(full){ showNotice('Request received — currently full',
    `All rooms are booked right now, so your request goes on the <b>waiting list</b>.<br><br>A room can open up if a confirmed guest doesn\'t arrive or cancels. You can also <b>speak with the guest house team</b> to check on availability.<br><br>The team has been notified and will allocate a room as soon as one is free.`, '🕓'); }
  else toast('Request submitted ✓');
}

async function shareRequest(id){

  if(typeof html2canvas!=='function'){ toast('Image tool still loading — try again in a moment'); return; }

  const row=(k,v)=>`<tr><td style="color:#7a6a58;padding:5px 0;font-size:13px">${k}</td><td style="text-align:right;font-weight:700;padding:5px 0;font-size:13px">${esc(v)}</td></tr>`;
  const card=document.createElement('div');
  card.style.cssText='position:fixed;left:-9999px;top:0;width:360px;padding:20px;background:#fff9f0;font-family:system-ui,-apple-system,Arial,sans-serif;color:#2b2118;border:2px solid #e8891f;border-radius:16px';

    <div style="text-align:center;margin-bottom:12px">

      ${seeMoney()?row('Donation', money(b.donation)):''}

      ${row('Guest house', locTxt)}

  document.body.appendChild(card);
  try{
    const canvas=await html2canvas(card,{scale:2,backgroundColor:'#fff9f0'});
    if(card.parentNode) document.body.removeChild(card);
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
    const file=new File([blob],'HKM-booking-'+(headLabel(b)||b.id)+'.png',{type:'image/png'});
    // 1) Copy the IMAGE to the clipboard so it can be pasted straight into WhatsApp
    if(navigator.clipboard && window.ClipboardItem){

    }
    // 2) Fallback for browsers without image-clipboard: open the share sheet with the image
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'Sri Vrindavan Booking', text:'Accommodation booking — '+headLabel(b)}); return; }catch(e){ if(e && e.name==='AbortError') return; }
    }
    // 3) Last resort: download the image so it can be attached in WhatsApp
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
    toast('Image saved — attach it in WhatsApp');
  }catch(e){ if(card.parentNode) document.body.removeChild(card); console.warn(e); toast('Could not create the image'); }
}

function viewDash(){
  const hotels=DB.hotels, bk=DB.bookings;
  const totCap=hotels.reduce((s,h)=>s+hotelCapacity(h),0);
  const totRooms=hotels.reduce((s,h)=>s+hotelRoomsTotal(h),0);
  // Date range the dashboard reports on (single night when From = To). Defaults to the whole festival.
  const dFrom = dashFrom || DB.rules.eventStart;
  const dTo   = dashTo   || prevDay(DB.rules.eventEnd);
  const single = dFrom===dTo;
  const overlapsRange=b=> datesOverlap(dFrom, nextDay(dTo), (b.checkin||DB.rules.eventStart), (b.checkout||DB.rules.eventEnd));
  const dWinEnd=nextDay(dTo);   // occupancy window covers nights dFrom..dTo
  // Rooms occupied at the busiest night within the range (per hotel/room-type pool, then summed).
  const roomsBooked=hotels.reduce((s,h)=>s+h.rooms.reduce((a,r)=>a+peakRoomsUsedRange(h.id,r.type,dFrom,dTo),0),0);
  // Rooms bookable starting on the selected date = hotels open on that night; each covers up to when it closes.
  const roomsAvail=hotels.filter(h=>h.active && hotelOriginEnd(h,dFrom,dWinEnd)!==null).reduce((s,h)=>{ const oe=hotelOriginEnd(h,dFrom,dWinEnd); return s+h.rooms.reduce((a,r)=>a+freeRoomsForStay(h,r.type,dFrom,oe),0); },0);
  const pending=bk.filter(b=>b.status==='pending' && overlapsRange(b)).length;
  const confirmed=bk.filter(b=>b.status==='confirmed' && overlapsRange(b)).length;
  const waitlist=bk.filter(b=>b.status==='waitlist' && overlapsRange(b)).length;

function setReqSort(v){ reqSort=v; render(); }

function sortBookings(list,mode){ const l=[...list];
  if(mode==='amtHigh') l.sort((a,c)=>(c.donation||0)-(a.donation||0));
  else if(mode==='amtLow') l.sort((a,c)=>(a.donation||0)-(c.donation||0));
  else if(mode==='newest') l.sort((a,c)=>(c.created||0)-(a.created||0));     // most recently submitted first
  else if(mode==='oldest') l.sort((a,c)=>(a.created||0)-(c.created||0));     // earliest submitted first
  else if(mode==='dateEarly') l.sort((a,c)=>(a.checkin||'').localeCompare(c.checkin||''));
  else if(mode==='dateLate') l.sort((a,c)=>(c.checkin||'').localeCompare(a.checkin||''));
  else l.sort((a,c)=>{ const da=(a.status==='pending'||a.status==='waitlist')?0:1, dc=(c.status==='pending'||c.status==='waitlist')?0:1; if(da!==dc)return da-dc; return reqSortVal(c)-reqSortVal(a); });
  return l; }

/* ---------------- Admin: Braj Nidhi reallocation & swaps ---------------- */
const BRAJ_ID='h1';
let reallocPlan=null, swapPreview=null;
/* Compute which outside bookings can be moved into Braj Nidhi, by donation then date, whole-group-fits only. */
function computeRealloc(){
  const braj=DB.hotels.find(h=>h.id===BRAJ_ID); if(!braj) return [];
  const eligible=DB.bookings.filter(b=>b.status==='confirmed'&&b.hotel!==BRAJ_ID&&!b.locked)
    .sort((a,b)=> (b.donation||0)-(a.donation||0) || (a.created||0)-(b.created||0));
  const reserved={}; const moves=[];
  for(const b of eligible){
    const avail=braj.rooms.map(r=>({type:r.type,cap:r.cap,
      free:Math.max(0, r.count - roomsAssignedByType(BRAJ_ID,r.type) - (reserved[r.type]||0))}))
      .filter(r=>r.free>0).sort((a,c)=>c.cap-a.cap);
    let remaining=b.count; const plan=[];
    for(const r of avail){ if(remaining<=0)break; const take=Math.min(r.free,Math.ceil(remaining/r.cap)); if(take>0){plan.push({type:r.type,rooms:take}); remaining-=take*r.cap;} }
    if(remaining<=0){ plan.forEach(p=>reserved[p.type]=(reserved[p.type]||0)+p.rooms);
      moves.push({id:b.id,head:b.head,count:b.count,donation:b.donation,fromHotel:hotelName(b.hotel),plan}); }
  }
  return moves;
}
function startRealloc(){ reallocPlan=computeRealloc(); swapPreview=null; render();
  if(!reallocPlan.length) toast('No eligible booking fully fits Braj Nidhi right now'); }
function cancelRealloc(){ reallocPlan=null; render(); }
function confirmRealloc(){ if(!reallocPlan) return;
  reallocPlan.forEach(m=>{ const b=DB.bookings.find(x=>x.id===m.id); if(!b||b.locked)return;
    b.hotel=BRAJ_ID; b.roomPlan=m.plan; b.roomType=m.plan[0].type; b.rooms=m.plan.reduce((s,p)=>s+p.rooms,0);
    notify('edit',`Moved to Braj Nidhi: ${b.head} (${b.count} people)`, b.brahmachari, b.id); });
  save(); const n=reallocPlan.length; reallocPlan=null; render(); toast(n+' booking(s) moved to Braj Nidhi'); }
/* Priority mismatches: an outside group donated more than an inside Braj Nidhi group. */
function priorityMismatches(){
  const inside=DB.bookings.filter(b=>b.status==='confirmed'&&b.hotel===BRAJ_ID&&!b.locked).sort((a,b)=>(a.donation||0)-(b.donation||0));  // lowest donation first
  const outside=DB.bookings.filter(b=>b.status==='confirmed'&&b.hotel!==BRAJ_ID&&!b.locked).sort((a,b)=>(b.donation||0)-(a.donation||0)); // highest donation first
  const pairs=[]; const used=new Set();
  outside.forEach(o=>{ const i=inside.find(x=>!used.has(x.id)&&(o.donation||0)>(x.donation||0));   // each outside gets a DISTINCT lower-donation inside guest
    if(i){ used.add(i.id); pairs.push({o,i,diff:(o.donation||0)-(i.donation||0)}); } });
  return pairs;
}
function startSwap(oId,iId){ const o=DB.bookings.find(x=>x.id===oId), i=DB.bookings.find(x=>x.id===iId);
  if(!o||!i){ toast('Booking not found'); return; }
  if(o.locked||i.locked){ toast('One of these bookings is locked — unlock it first'); return; }
  const planO=packGroup(BRAJ_ID,o.count,iId);          // outside group into Braj Nidhi with inside group's rooms freed
  const planI=packGroup(o.hotel,i.count,oId);          // inside group into the outside hotel with outside group's rooms freed
  if(!planO){ toast(o.head+' cannot fully fit in Braj Nidhi even after freeing the other group'); return; }

function stepRooms(id,delta){ const b=DB.bookings.find(x=>x.id===id); if(!b)return;
  const wasConfirmed=b.status==='confirmed'; const oldRooms=b.rooms||0;
  b.rooms=Math.max(0,(b.rooms||0)+delta); b.roomPlan=null;
  if(wasConfirmed && (isSuper()||isVcm()) && b.rooms!==oldRooms) markEdited(b,'Rooms: '+oldRooms+' → '+b.rooms);
  save(); render(); }
function toggleSeva(id){ const b=DB.bookings.find(x=>x.id===id); if(!b)return; b.sevaCollected=!b.sevaCollected;
  if(b.sevaCollected){ if(!b.sevaChannel)b.sevaChannel='GPP'; b.sevaDate=b.sevaDate||new Date().toISOString().slice(0,10); } save(); render(); }
function setSevaChannel(id,v){ const b=DB.bookings.find(x=>x.id===id); if(!b)return;
  if(v==='GuestHouse') v='GPP';   // VCM Guest House does not collect payment — always Staff/GPP
  b.sevaChannel=v; b.sevaCollected=!!v; b.sevaDate = v ? (b.sevaDate||new Date().toISOString().slice(0,10)) : ''; save(); render();
  if(v) toast('Seva marked received by '+(v==='GPP'?"GPP's Team (Staff)":'Devotee')); }
/* Status shown to the devotee. A ₹50k+ donor (once receipt verified) is assured — status shows Confirmed
   even while the actual room/location is still being allocated. Location appears only after allocation. */
function devoteeStatusPill(b){
  if(b.status==='confirmed') return '<span class="pill p-confirmed">Confirmed</span>';
  if(b.status==='cancelled'||b.status==='withdrawn'||b.status==='rejected') return statusPill(b.status);
  const waitNote = (b.bookedWhenFull && !b.hotel)
    ? `<div class="rooms-mini" style="margin-top:4px;color:var(--amber);background:#fdf0dc;border:1px solid #f0d9b0;border-radius:8px;padding:4px 8px">🕓 Currently full — on the waiting list. A room may open if a guest doesn\'t arrive; you can also contact the guest house team.</div>`
    : '';
  const assured=(b.donation>=DB.rules.freeMin);   // ₹50k+ → accommodation assured immediately (location shared later)
  return (assured ? '<span class="pill p-confirmed">Confirmed</span><div class="rooms-mini" style="margin-top:3px">room assured</div>' : '<span class="pill p-pending">Pending</span>') + waitNote; }
/* accommodation payment status shown to the devotee */
function sevaLabel(b){
  if((b.guestType||'FR')!=='FR') return `<span class="pill p-confirmed">🎫 ${esc(b.guestType)}</span>`;   // PR / Media / Volunteer: no seva prompt
  if(b.donation>=DB.rules.freeMin) return '<span class="pill p-confirmed">🙏 Free stay</span>';
  return b.sevaCollected ? '<span class="pill p-confirmed">✅ Seva received</span>' : '<span class="pill p-pending">💰 Seva to be paid</span>'; }
/* Record that a booking was edited: who (login id) + when + WHAT changed. Notifies admin/VCM; devotee sees it on My Requests. */
function markEdited(b, note){ b.edited=true; b.editedAt=Date.now(); b.editedBy=USER.id; b.lastEditNote=note||'';
  notify('edit', (b.head?b.head+' — ':'')+(note||'request edited')+' — by '+USER.id, b.brahmachari||'', b.id); }
function editedTag(b){ if(!b.edited) return ''; const who=b.editedBy?('by '+esc(b.editedBy)):'by guest'; const when=b.editedAt?(' on '+fmtDT(b.editedAt)):''; const what=b.lastEditNote?('<div class="rooms-mini" style="color:var(--saffron-dark)">↪ '+esc(b.lastEditNote)+'</div>'):''; return ' <span class="pill p-edited">✏️ edited '+who+when+'</span>'+what; }
function fieldLabel(f){ return {hotel:'Guest house',roomType:'Room type',rooms:'Rooms',extraBeds:'Extra beds',transferRoomType:'Braj Nidhi room',transferRooms:'Braj Nidhi rooms'}[f]||f; }
function fieldVal(f,v){ return f==='hotel' ? (v?hotelName(v):'—') : ((v===''||v===undefined||v===null)?'—':v); }
function setField(id,f,v){ const b=DB.bookings.find(x=>x.id===id); if(!b)return;
  const wasConfirmed=b.status==='confirmed';
  const isTransfer=(f==='transferRoomType'||f==='transferRooms');
  const oldV = (f==='hotel') ? b.hotel : ((f==='transferRoomType'||f==='transferRooms') ? transferPlan(b)[f==='transferRoomType'?'type':'rooms'] : b[f]);
  if(f==='rooms'||f==='extraBeds'||f==='transferRooms') b[f]=Math.max(0,parseInt(v)||0); else b[f]=v;
  if(!isTransfer) b.roomPlan=null;   // manual edit overrides any multi-room auto plan (origin fields only)
  if(f==='hotel'){ b.roomType=''; b.rooms=0; b.extraBeds=0; }
  if(f==='roomType'){ const h=DB.hotels.find(x=>x.id===b.hotel); const r=h&&h.rooms.find(x=>x.type===v);
    if(r&&(!b.rooms||b.rooms<1)) b.rooms=Math.ceil(b.count/r.cap); }  // auto-fill rooms needed
  if(f==='transferRoomType'){ const r=brajRoomsList().find(x=>x.type===v); if(r) b.transferRooms=Math.max(1,Math.ceil((b.count||1)/r.cap)); }  // auto-fill Braj Nidhi rooms
  const newV = (f==='hotel') ? b.hotel : ((f==='transferRoomType'||f==='transferRooms') ? transferPlan(b)[f==='transferRoomType'?'type':'rooms'] : b[f]);
  if(wasConfirmed && (isSuper()||isVcm()) && String(oldV)!==String(newV)) markEdited(b, fieldLabel(f)+': '+fieldVal(f,oldV)+' → '+fieldVal(f,newV));
  save();
  if(['hotel','roomType','rooms','extraBeds','transferRoomType','transferRooms'].includes(f)) render(); }
function stepTransfer(id,delta){ const b=DB.bookings.find(x=>x.id===id); if(!b)return;
  const oldR=transferPlan(b).rooms; const nv=Math.max(0,oldR+delta); b.transferRooms=nv;
  if(b.status==='confirmed' && (isSuper()||isVcm()) && oldR!==nv) markEdited(b,'Braj Nidhi rooms: '+oldR+' → '+nv);
  save(); render(); }
/* Move a booking whose origin house is closed for its whole stay straight into Braj Nidhi. */
function fixClosedHotel(id){ const b=DB.bookings.find(x=>x.id===id); if(!b)return;
  const tp=transferPlan(b); const oldHotel=hotelName(b.hotel);
  b.hotel='h1'; b.roomType=tp.type; b.rooms=tp.rooms; b.roomPlan=null; b.transferRoomType=''; b.transferRooms=0;
  if(b.status==='confirmed' && (isSuper()||isVcm())) markEdited(b,'Guest house: '+oldHotel+' (closed for these dates) → Braj Nidhi '+tp.type+' × '+tp.rooms);
  save(); render(); toast('Moved to Braj Nidhi — '+tp.type+' × '+tp.rooms); }
function approveNoReceipt(id){ if(!isSuper()){ toast('Only the Super Admin can confirm without a verified receipt'); return; } approve(id,true); }
function approve(id,skipReceipt){ const b=DB.bookings.find(x=>x.id===id); if(!b)return;
  const h=DB.hotels.find(x=>x.id===b.hotel);
  if(!h||!b.roomType||!b.rooms){ toast('Pick a hotel, room type and at least 1 room first'); return; }
  const needsReceipt=(b.guestType||'FR')==='FR';   // PR / Media / Volunteer don't need a receipt
  if(!needsReceipt && !isSuper()){ toast((b.guestType)+' bookings can only be confirmed by the Super Admin'); return; }
  if(needsReceipt && !skipReceipt && !b.donationVerified){ toast(b.receiptWrong?'Receipt is marked WRONG — devotee must correct it (or use “Confirm without receipt”)':'Cannot confirm — verify the donation receipt first in the 🧾 Receipts panel'); return; }
  b.confirmedWithoutReceipt = !!(skipReceipt && needsReceipt && !b.donationVerified);
  const roomObj=h.rooms.find(r=>r.type===b.roomType);
  const oEnd=hotelOriginEnd(h,b.checkin,b.checkout);
  if(oEnd===null){ toast(h.name+' is not available on '+fmtD(b.checkin)+' — pick another guest house'); return; }
  const avail=freeRoomsForStay(h,b.roomType,b.checkin,oEnd,id);   // free for the nights this hotel covers (rest continues in Braj Nidhi)
  if(avail<=0){ toast('No '+b.roomType+' room free at '+h.name+' for '+fmtD(b.checkin)+'→'+fmtD(oEnd)+' — pick another room type or hotel'); return; }
  if(b.rooms>avail){ toast('Only '+avail+' '+b.roomType+' room(s) free at '+h.name+' for these dates — reduce rooms to '+avail); return; }
  if((b.extraBeds||0)>0 && !h.extraBedding){ toast(h.name+' does not allow extra bedding — set extra beds to 0'); return; }
  // Room allotment is NEVER blocked by a pending seva payment. Staff-collect bookings just show "Payment due"
  // and Staff (GPP's Team) can collect it later. Auto-mark the channel as Staff when it's not the devotee's own.
  if(needsReceipt && b.donation<DB.rules.freeMin && !b.sevaCollected && b.sevaPlan!=='devotee' && !b.sevaChannel){ b.sevaChannel='GPP'; }
  b.status='confirmed'; save(); render();
  const extraMsg=(b.extraBeds||0)>0?` + ${b.extraBeds} extra bed`:'';
  const cts=hotelSendContacts(h.id);
  const ctMsg=cts.length?' · contact '+cts.map(c=>c.name+' '+c.phone).join(', '):'';
  toast('✓ Confirmed: '+h.name+' · '+b.roomType+' × '+b.rooms+extraMsg+ctMsg+' — email sent to '+b.brahmachari); }
function setStatus(id,s){ const b=DB.bookings.find(x=>x.id===id); if(!b)return; b.status=s; save(); render();
  toast('Status: '+s+' — notification sent'); }

function addHotel(){ const n=$('#newHotel').value.trim(); if(!n){toast('Enter hotel name');return;}

/* Re-evaluate pending requests against the CURRENT hotel criteria. Any tentative hotel a request no longer
   qualifies for (donation below the hotel's min, or hotel inactive/removed) is reset so the fresh suggestion
   recalculates. Returns how many were reset. */
function recalcPending(){ let cleared=0; const reserved=reservedHotelIds();
  DB.bookings.filter(b=>b.status==='pending'||b.status==='waitlist').forEach(b=>{
    if(b.hotel){ const h=DB.hotels.find(x=>x.id===b.hotel);
      const catBad = h && guestCategory(b)!=='D1' && reserved.includes(h.id);   // reserved hotel but guest not D1
      if(!h || !h.active || (b.donation||0) < (h.minDonation||0) || catBad){
        b.hotel=''; b.roomType=''; b.rooms=0; b.roomPlan=null; cleared++; } } });
  return cleared; }
function editHotel(id,f,v){ const h=DB.hotels.find(x=>x.id===id); if(!h)return; h[f]=parseInt(v)||0;
  const cleared=recalcPending(); save(); render();
  if(f==='minDonation') toast('Pending requests recalculated with the new donation criteria'+(cleared?` — ${cleared} allocation(s) reset`:'')); }
function toggleExtra(id){ const h=DB.hotels.find(x=>x.id===id); h.extraBedding=!h.extraBedding; save(); render(); }
function editHotelText(id,f,v){ const h=DB.hotels.find(x=>x.id===id); if(!h)return; h[f]=v; save(); render(); }
function toggleHotel(id){ const h=DB.hotels.find(x=>x.id===id); h.active=!h.active; recalcPending(); save(); render(); }

function saveRoom(id,i){ const h=DB.hotels.find(x=>x.id===id); const r=h&&h.rooms[i]; if(!r)return;

  const list=reportBookings();
  const rows=list.map(b=>`<tr data-search="${esc(((b.head||'')+' '+(b.phone||'')+' '+(b.brahmachari||'')).toLowerCase())}">
      <td><b>${esc(b.head||'')}</b>${(b.guestType&&b.guestType!=='FR')?' <span class="pill p-waitlist">'+esc(b.guestType)+'</span>':''}<div class="muted">${peopleLabel(b)}${b.phone?' · 📱 '+esc(b.phone):''} · by ${esc(devoteeName(b))}</div></td>
      <td>${allocHotelText(b)}</td>
      <td>${allocSummary(b)}</td>
      <td>${fmtD(b.checkin)}</td>
      <td>${fmtD(b.checkout)}</td>
      <td><b>${nights(b)}</b> night${nights(b)===1?'':'s'}</td></tr>`).join('');
  return `<div class="card"><h2 class="section">📥 Accommodation Report <span class="pill p-confirmed">${list.length}</span></h2>
    <p class="subhead">Who has been accommodated in which guest house and room, and how many nights they stay. Split/extended stays show both guest houses with dates. Download as Excel (no donation amounts).</p>
    <div class="flex" style="margin-bottom:12px;gap:10px">
      <input placeholder="🔍 Search by name or number" value="${esc(searchQ['reportRows']||'')}" oninput="setSearch('reportRows',this.value)" style="flex:1">
      <select onchange="setReportHotel(this.value)" style="max-width:200px"><option value="all" ${reportHotel==='all'?'selected':''}>All guest houses</option>${hotelOpts}</select>
      <button class="btn ${reportSort==='days'?'':'gray'} sm" onclick="toggleReportSort()">↕ ${reportSort==='days'?'Longest stay first ✓':'Sort by longest stay'}</button>
      <button class="btn" onclick="exportAccommodation()">📥 Export Excel</button>
    </div>
    <div class="scrollx"><table><thead><tr><th>Guest</th><th>Guest house(s)</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Nights</th></tr></thead>
      <tbody id="reportRows">${rows||'<tr><td colspan="6" class="muted">No confirmed accommodations yet</td></tr>'}</tbody></table></div></div>`;
}
/* ---------------- Payments / Seva collected panel ---------------- */
function sevaChannelLabel(b){ const v=b.sevaChannel; return (v==='GPP'||v==='GuestHouse'||v==='Staff')?"GPP's Team (Staff)":v==='Devotee'?('Devotee — '+esc(devoteeName(b))):'—'; }
/* Bookings that still need an accommodation seva collected (FR, below the free threshold, not settled) */
function isLowAmount(b){ return (b.guestType||'FR')==='FR' && !isFreeStay(b) && b.status!=='cancelled' && b.status!=='withdrawn'; }
function staffCollects(b){ return b.sevaPlan==='staff'; }                                       // otherwise the devotee collects
function needsStaffSeva(b){ return isLowAmount(b) && staffCollects(b) && !b.sevaCollected; }      // GPP's Team still to collect — unpaid or on hold
function sevaPlanLabel(b){ return staffCollects(b) ? "🧑‍🔧 GPP's Team will collect" : '🙋 Devotee will collect'; }
function sevaStatus(b){ if(!staffCollects(b)) return '<span class="pill p-waitlist">🙋 Will be collected by devotee</span>';
  if(b.sevaCollected) return '<span class="pill p-confirmed">✅ Paid — collected by '+esc(sevaChannelLabel(b))+'</span>';
  return '<span class="pill p-pending">💰 Payment due</span>'; }
/* Record seva payment — works for Staff, VCM and Super Admin (targeted cloud write) */
async function saveSevaNote(id,text){ const b=DB.bookings.find(x=>x.id===id); if(!b)return; b.sevaNote=(text||'').trim();
  try{ const {error}=await sb.from('bookings').update({data:bookingData(b),dev_id:b.devId||null}).eq('id',b.id);
    if(error){ console.warn('note save',error); toast('⚠ Could not save note — check connection'); } else toast('Status note saved'); }catch(e){ console.warn(e); } }
async function markSeva(id,mode){ const b=DB.bookings.find(x=>x.id===id); if(!b)return;
  if(mode==='paid'){ b.sevaCollected=true; b.sevaOnHold=false; b.sevaDate=new Date().toISOString().slice(0,10); b.sevaChannel='GPP'; }   // room payment is always collected by Staff = GPP's Team (VCM does not collect)
  else if(mode==='hold'){ b.sevaOnHold=true; b.sevaCollected=false; }
  else if(mode==='unpaid'){ b.sevaCollected=false; b.sevaOnHold=false; }
  render();
  try{ const {error}=await sb.from('bookings').update({data:bookingData(b),dev_id:b.devId||null}).eq('id',b.id);
    if(error){ console.warn('seva save',error); toast('⚠ Could not save — check connection'); } else toast(mode==='paid'?'Marked paid ✓':mode==='hold'?'Put on hold':'Marked unpaid'); }catch(e){ console.warn(e); }
}
function viewCollections(){
  const paid=DB.bookings.filter(b=>b.sevaCollected);
  const rows=paid.map(b=>`<tr>
      <td><b>${headLabel(b)}</b>${(b.guestType&&b.guestType!=='FR')?' <span class="pill p-waitlist">'+esc(b.guestType)+'</span>':''}</td>
      <td>${esc(devoteeName(b))}</td>
      <td>${b.hotel?esc(hotelName(b.hotel)):'<span class="muted">—</span>'}</td>
      <td>${b.roomType?allocSummary(b):'<span class="muted">—</span>'}</td>
      <td><span class="pill p-confirmed">Seva received</span></td>
      <td>${sevaChannelLabel(b)}</td>
      <td>${b.sevaDate?fmtD(b.sevaDate):'—'}</td>
      <td>${b.receipt?esc(b.receipt):'<span class="muted">—</span>'}</td>
    </tr>`).join('');
  return `<div class="card"><h2 class="section">💰 Room Payments / Seva Collected <span class="pill p-confirmed">${paid.length}</span></h2>
    <p class="subhead">Every guest whose room seva has been collected — by GPP's Team (Staff) or paid by the Devotee.</p>
    <div class="scrollx"><table><thead><tr><th>Guest / Family</th><th>Devotee</th><th>Guest house</th><th>Room</th><th>Payment</th><th>Received by</th><th>Date</th><th>Receipt no.</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="8" class="muted">No seva collected yet</td></tr>'}</tbody></table></div></div>`;
}
/* ---------------- Seva to collect (Staff, VCM, Super Admin) ---------------- */
function viewSevaCollect(){
  const staff = USER.role==='staff';
  const amt=b=>seeMoney()?money(b.donation):catBadge(b);
  const acts=b=>{
    if(!staffCollects(b)) return `<span class="muted">No action — devotee collects</span>`;
    if(b.sevaCollected) return `<button class="btn gray sm" onclick="markSeva('${b.id}','unpaid')">Mark unpaid</button>`;
    return `<button class="btn green sm" onclick="markSeva('${b.id}','paid')">✅ Paid</button>`;
  };
  // Staff sees ONLY the ones they (GPP's Team) must collect; devotee-collect ones are hidden (nothing for staff to do).
  // VCM & Super Admin see EVERY low-donation FR booking, with who booked it and who collects/collected.
  const list = staff ? DB.bookings.filter(b=>isLowAmount(b)&&staffCollects(b)) : DB.bookings.filter(isLowAmount);
  const cols = staff ? ['Guest / Family','Booked by','Donation','Who collects','Status','Dates','Action']
                     : ['Guest / Family','Booked by (Devotee)','Donation','Who collects','Payment / collected by','Dates','Action'];
  const row=b=>`<tr data-search="${esc(((b.head||'')+' '+(b.phone||'')+' '+(b.brahmachari||'')).toLowerCase())}">
    <td data-label="Guest"><b>${esc(headLabel(b))}</b><div class="muted">${esc(peopleLabel(b))}</div>${b.phone?`<div style="margin-top:2px"><a href="tel:${esc(b.phone)}" style="color:var(--saffron-dark);font-weight:600;text-decoration:none">📞 ${esc(b.phone)}</a></div>`:'<div class="muted">📞 no number</div>'}</td>
    <td data-label="Booked by">${esc(devoteeName(b)||'—')}</td>
    <td data-label="Donation">${amt(b)}</td>
    <td data-label="Who collects">${sevaPlanLabel(b)}</td>
    <td data-label="${staff?'Status':'Payment / collected by'}">${sevaStatus(b)}</td>
    <td data-label="Dates">${esc(stayLabel(b)||'—')}</td>
    <td data-label="Action"><div class="row-actions">${acts(b)}</div>
      <div style="margin-top:6px"><input type="text" value="${esc(b.sevaNote||'')}" placeholder="✍ status note (e.g. not answering, will pay 5 Sept)" style="width:100%;min-width:170px;font-size:12px" onchange="saveSevaNote('${b.id}',this.value)"></div></td></tr>`;
  const pendingCount = DB.bookings.filter(needsStaffSeva).length;
  return `<div class="card"><h2 class="section">💰 Seva to collect <span class="pill p-pending">${pendingCount} pending</span></h2>
    ${staff ? '' : '<p class="subhead">Every low‑donation (below ₹50,000) FR guest booked, showing <b>who booked</b> them and <b>who collects / collected</b> the seva. “Devotee will collect” needs no action — VCM can confirm the room directly.</p>'}
    <input placeholder="🔍 Search guest, number or devotee" value="${esc(searchQ['sevaRows']||'')}" oninput="setSearch('sevaRows',this.value)" style="margin-bottom:10px;max-width:380px">
    <div class="scrollx"><table class="stack-mobile"><thead><tr>${cols.map(c=>'<th>'+c+'</th>').join('')}</tr></thead>
      <tbody id="sevaRows">${list.map(row).join('')||('<tr><td colspan="'+cols.length+'" class="muted">Nothing here 🎉</td></tr>')}</tbody></table></div></div>`;
}
/* ---------------- Super Admin: Settings (rules) ---------------- */
function setRule(f,v){ DB.rules[f]=Math.max(0,parseInt(v)||0); syncHotelMinFromRules(); const c=recalcPending(); save(); render();
  toast('Rules updated — pending requests recalculated'+(c?` (${c} reset)`:'')); }
function setEventDate(f,v){ if(!v) return; DB.rules[f]=v; save(); render(); toast('Festival booking window updated'); }
function toggleCatHotel(cat,hid){ const map=DB.rules.categoryHotels; if(!map[cat])map[cat]=[];
  const i=map[cat].indexOf(hid); if(i>=0)map[cat].splice(i,1); else map[cat].push(hid);
  syncHotelMinFromRules(); const c=recalcPending(); save(); render();
  toast('Category mapping updated — pending recalculated'+(c?` (${c} reset)`:'')); }
function viewSettings(){
  const r=DB.rules, inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
  const hotelCheck=(cat)=>DB.hotels.map(h=>`<label style="display:flex;gap:7px;align-items:center;margin:4px 0;font-weight:500">
      <input type="checkbox" style="width:auto" ${(r.categoryHotels[cat]||[]).includes(h.id)?'checked':''} onchange="toggleCatHotel('${cat}','${h.id}')"> ${esc(h.name)}</label>`).join('');
  return `<div class="card"><h2 class="section">🎪 Festival booking window</h2>
    <p class="subhead">Devotees can only book stays within these dates. Only the Super Admin can change this.</p>
    <div class="grid g2">
      <div><label>Booking from</label><input type="date" value="${r.eventStart}" onchange="setEventDate('eventStart',this.value)"></div>
      <div><label>Booking to</label><input type="date" value="${r.eventEnd}" onchange="setEventDate('eventEnd',this.value)"></div>
    </div>
    <p class="muted" style="margin-top:8px">Current window: ${fmtD(r.eventStart)} – ${fmtD(r.eventEnd)} ${r.eventStart.slice(0,4)}</p>
    </div>
    <div class="card"><h2 class="section">⚙️ Settings — Donation categories & suggestion rules</h2>
    <p class="subhead">Super Admin only. Any change here instantly recalculates all pending requests with the new rules.</p>
    <div class="grid g3">
      <div><label>D1 minimum (₹) — top category</label><input type="number" min="0" value="${r.d1Min}" onchange="setRule('d1Min',this.value)"></div>
      <div><label>D2 minimum (₹)</label><input type="number" min="0" value="${r.d2Min}" onchange="setRule('d2Min',this.value)"></div>
      <div><label>Free-stay minimum (₹)</label><input type="number" min="0" value="${r.freeMin}" onchange="setRule('freeMin',this.value)"></div>
    </div>
    <p class="muted" style="margin-top:8px">D1 = ${inr(r.d1Min)} and above &nbsp;·&nbsp; D2 = ${inr(r.d2Min)} to below ${inr(r.d1Min)} &nbsp;·&nbsp; D3 = below ${inr(r.d2Min)} &nbsp;·&nbsp; Free stay ≥ ${inr(r.freeMin)}</p>
    </div>
    <div class="grid g3">
      <div class="card"><h2 class="section" style="margin:0 0 6px">D1 → guest houses</h2><p class="rooms-mini" style="margin:0 0 6px">Reserved for D1 only</p>${hotelCheck('D1')}</div>
      <div class="card"><h2 class="section" style="margin:0 0 6px">D2 → guest houses</h2>${hotelCheck('D2')}</div>
      <div class="card"><h2 class="section" style="margin:0 0 6px">D3 → guest houses</h2>${hotelCheck('D3')}</div>
    </div>`;
}
function viewDonations(){
  const rows=DB.bookings.map(b=>`<tr>
    <td><b>${headLabel(b)}</b><div class="muted">by ${esc(devoteeName(b))} · ${peopleLabel(b)}</div></td>
    <td>${money(b.donation)}</td>
    <td>${b.receipt?`📎 <b>${esc(b.receipt)}</b>`:'<span class="muted">no receipt no.</span>'}</td>
    <td>${b.donationVerified
      ? `<span class="pill p-confirmed">✓ verified</span> <button class="btn gray sm" onclick="verifyDonation('${b.id}')">undo</button>`
      : `<button class="btn sm" onclick="verifyDonation('${b.id}')">Verify receipt</button>`}</td>
    <td>${statusPill(b.status)}</td>
  </tr>`).join('');
  const tot=DB.bookings.reduce((s,b)=>s+(b.donation||0),0);
  const verifiedCount=DB.bookings.filter(b=>b.donationVerified).length;
  return `<div class="card"><h2 class="section">🧾 Donations</h2>
    <p class="subhead">Check each receipt number and press <b>Verify receipt</b> to confirm it. Receipts should be verified before allocation.</p>
    <div class="grid g2" style="max-width:520px;margin-bottom:14px">
      <div class="stat"><div class="n">${money(tot)}</div><div class="l">Total pledged</div></div>
      <div class="stat"><div class="n">${verifiedCount} / ${DB.bookings.length}</div><div class="l">Receipts verified</div></div>
    </div>
    <table><thead><tr><th>Donor / Devotee</th><th>Amount</th><th>Receipt number</th><th>Verify</th><th>Booking</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

/* ---------------- Super Admin: Logins (all IDs & passwords) ---------------- */
function copyStr(s,msg){ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(()=>toast((msg||'Copied')+': '+s),()=>fallbackCopy(s)); } else fallbackCopy(s); }
function setAssign(id,val){ DB.assign=DB.assign||{}; DB.assign[id]=val.trim(); sb.from('profiles').update({assigned_name:val.trim()}).eq('login_id',id).then(()=>{},e=>console.warn('assign',e)); }
function filterLoginRows(q){ q=(q||'').toLowerCase().trim();
  document.querySelectorAll('#loginRows tr').forEach(tr=>{ const s=tr.dataset.s||''; tr.style.display=s.includes(q)?'':'none'; }); }
function loginRoleLabel(r){ return r==='admin'?'Super Admin':r==='vcm'?'Admin (VCM)':r==='staff'?'Staff':'Devotee'; }
/* Copy the full login (ID + password + person's name) as text so it can be shared on WhatsApp */
function copyLogin(id){
  const pw=(DB.creds&&DB.creds[id])||''; const name=(DB.assign&&DB.assign[id])||'';
  const txt='Sri Vrindavan — Booking Portal\nhttps://srivrindavan.com\n\nLogin ID: '+id+'\nPassword: '+pw+(name?('\nName: '+name):'');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('✅ Login copied — paste it to share'),()=>fallbackCopy(txt)); } else fallbackCopy(txt);
}
function viewLogins(){
  DB.assign=DB.assign||{}; DB.creds=DB.creds||{};
  const order={admin:0,vcm:1,staff:2,brahmachari:3};
  const list=[...(DB.loginList||[])].sort((a,b)=> (order[a.role]-order[b.role]) || a.login_id.localeCompare(b.login_id));
  const rows=list.map(u=>{ const to=DB.assign[u.login_id]||''; const pw=DB.creds[u.login_id]||''; const rl=loginRoleLabel(u.role);
    return `<tr data-s="${esc((u.login_id+' '+rl+' '+to).toLowerCase())}">
      <td data-label="Login ID"><span class="rcp-copy" onclick="copyLogin('${u.login_id}')" title="Click to copy this login">${u.login_id}</span></td>
      <td data-label="Password"><span class="rcp-copy" onclick="copyLogin('${u.login_id}')" title="Click to copy this login">${esc(pw||'••••')}</span></td>
      <td data-label="Role">${rl}</td>
      <td data-label="Assigned to"><input type="text" value="${esc(to)}" placeholder="type person's name" style="min-width:150px" onchange="setAssign('${u.login_id}',this.value)"></td>
      <td data-label="Share"><button class="btn sm" onclick="copyLogin('${u.login_id}')">📋 Copy</button></td>
    </tr>`; }).join('');
  const counts=['admin','vcm','staff','brahmachari'].map(r=>loginRoleLabel(r)+': '+list.filter(u=>u.role===r).length).join(' · ');
  return `<div class="card"><h2 class="section">🔑 Logins</h2>
    <p class="subhead">All ${list.length} login accounts. Passwords are visible only to you (Super Admin) — no other role can see them. Tap <b>Copy</b> (or a row's ID/password) to copy the <b>Login ID + Password + Name</b> together, ready to paste into WhatsApp. ${counts}.</p>
    <input placeholder="🔍 Search ID, role, or assigned name" value="${esc(searchQ['loginRows']||'')}" oninput="setSearch('loginRows',this.value)" style="max-width:360px;margin-bottom:10px">
    <div style="overflow:auto">
    <table class="stack-mobile"><thead><tr><th>Login ID</th><th>Password</th><th>Role</th><th>Assigned to (person's name)</th><th>Share</th></tr></thead>
      <tbody id="loginRows">${rows}</tbody></table></div></div>`;
}

/* init total line after render */
const _origRender=render;
render=function(){ _origRender(); if(currentTab==='newreq'){ updateSummary(); renderDateRows(); prefillEdit(); updateTypeUI(); }
  reapplySearches();
  if(USER&&(USER.role==='admin'||USER.role==='vcm')) updateNotifBadge(); };
function updateNotifBadge(){ const n=DB.notifications.filter(x=>!x.ack).length; const el=$('#notifBadge');
  if(el){ el.textContent=n||''; el.style.display=n?'':'none'; } }
initLoginPrefill();
</script>
</body>
</html>
